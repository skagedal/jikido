name: CI

on:
  push:
    branches: ["main"]
  pull_request: {}

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The SDK version is pinned in .fvmrc, which is also what fvm reads
          # locally — so a bump is one committed file and CI follows it with
          # no change here.
          flutter-version-file: .fvmrc
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
